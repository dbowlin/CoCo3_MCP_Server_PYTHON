[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coco3-mcp"
version = "2.0.0"
description = "Stdlib MCP server that drives a CoCo 3 under MAME"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
coco3-mcp = "coco3_mcp.__main__:main"
coco3-mcp-serve = "coco3_mcp.serve:main"
coco3-mcp-activate = "coco3_mcp.activate:main"

[tool.setuptools.packages.find]
include = ["coco3_mcp*"]
